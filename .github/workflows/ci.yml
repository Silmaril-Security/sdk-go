name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x", "1.24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  alpha-integration:
    name: Alpha integration
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SILMARIL_API_KEY: ${{ secrets.SILMARIL_API_KEY }}
      SILMARIL_API_URL: ${{ secrets.SILMARIL_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Verify live credentials
        run: |
          test -n "$SILMARIL_API_KEY" || { echo "::error::SILMARIL_API_KEY repo secret is required"; exit 1; }
          test -n "$SILMARIL_API_URL" || { echo "::error::SILMARIL_API_URL repo secret is required"; exit 1; }

      - name: Run alpha integration tests
        run: go test -tags=integration ./...

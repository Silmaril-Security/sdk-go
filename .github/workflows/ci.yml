name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

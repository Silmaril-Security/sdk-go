name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.26.x", "1.27.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Compile the independent customer app without credentials
        run: |
          consumer_dir=$(mktemp -d)
          cp customer/consumer.go "$consumer_dir/main.go"
          go -C "$consumer_dir" mod init customer-consumer
          go -C "$consumer_dir" mod edit -require=github.com/Silmaril-Security/sdk-go@v0.0.0 -replace=github.com/Silmaril-Security/sdk-go="$GITHUB_WORKSPACE"
          go -C "$consumer_dir" build -mod=mod -o "$consumer_dir/customer" .

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package-version:
    name: Package version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install semver==3.0.4
      - name: Compare the proposed merge with its main parent
        run: python3 .github/scripts/check-package-version.py HEAD^1 HEAD

  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.26.x", "1.27.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Compile the independent customer apps without credentials
        run: |
          for consumer in consumer.go consumer_protect.go; do
            consumer_dir=$(mktemp -d)
            cp "customer/$consumer" "$consumer_dir/main.go"
            go -C "$consumer_dir" mod init customer-consumer
            go -C "$consumer_dir" mod edit -require=github.com/Silmaril-Security/sdk-go@v0.0.0 -replace=github.com/Silmaril-Security/sdk-go="$GITHUB_WORKSPACE"
            go -C "$consumer_dir" build -mod=mod -o "$consumer_dir/customer" .
          done

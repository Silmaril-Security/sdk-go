name: Main qualification and release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_tag:
    name: Verify pushed tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Verify tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Test
        run: go test -race ./...

  release:
    name: Release from main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Select affected customer journeys
        id: selection
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PYCODE'
          import os, subprocess
          before = os.environ.get('BEFORE', '')
          try:
              paths = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], stderr=subprocess.DEVNULL, text=True).splitlines()
              selected = not paths or any(not (p.endswith(('.md', '.mdx')) or p.startswith('docs/')) for p in paths)
          except subprocess.CalledProcessError:
              selected = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('should_test=' + str(selected).lower() + '\n')
          PYCODE

      - name: Decide whether to release
        id: plan
        run: bash scripts/plan-release.sh

      - name: Format check
        if: steps.plan.outputs.should_release == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Tidy check
        if: steps.plan.outputs.should_release == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        if: steps.selection.outputs.should_test == 'true' || steps.plan.outputs.should_release == 'true'
        run: go vet ./...

      - name: Test
        if: steps.selection.outputs.should_test == 'true' || steps.plan.outputs.should_release == 'true'
        run: go test -race ./...

      - name: Check shared runner configuration
        if: steps.selection.outputs.should_test == 'true' || steps.plan.outputs.should_release == 'true'
        id: configured
        env:
          APP_KEY: ${{ secrets.CUSTOMER_TESTS_APP_PRIVATE_KEY }}
          APP_ID: ${{ vars.CUSTOMER_TESTS_APP_CLIENT_ID }}
        run: |
          if [ -n "$APP_KEY" ] && [ -n "$APP_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            mkdir -p results
            echo '{"status":"BLOCKED","errors":["Configure the customer testing GitHub App and Test Tenant A credentials"]}' > results/result.json
            echo '## Customer qualification: BLOCKED — shared runner access is not configured' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create scoped repository read token
        continue-on-error: true
        if: steps.configured.outputs.ready == 'true'
        id: reader
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CUSTOMER_TESTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUSTOMER_TESTS_APP_PRIVATE_KEY }}
          owner: Silmaril-Security
          repositories: SilmarilCustomerTests,firewall-ui,silmaril-firewall-mcp
          permission-contents: read
      - name: Checkout pinned shared runner
        continue-on-error: true
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Silmaril-Security/SilmarilCustomerTests
          ref: d9707b9ff86a463db2272610ff19d898b0d227b3
          token: ${{ steps.reader.outputs.token }}
          path: _customer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact Go module candidate
        continue-on-error: true
        if: steps.configured.outputs.ready == 'true'
        run: python _customer/scripts/package_go.py --output dist/go-proxy.zip
      - name: Resolve package artifact
        continue-on-error: true
        if: steps.configured.outputs.ready == 'true'
        id: package
        run: |
          files=(dist/go-proxy.zip)
          test "${#files[@]}" = 1 && test -f "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Customer journey
        if: steps.configured.outputs.ready == 'true'
        id: acceptance
        continue-on-error: true
        uses: ./_customer
        with:
          sdk: go
          artifact: ${{ steps.package.outputs.path }}
          consumer: customer/consumer.go
          source-sha: ${{ github.sha }}
          framework-sha: d9707b9ff86a463db2272610ff19d898b0d227b3
        env:
          SILMARIL_API_URL: ${{ vars.CUSTOMER_API_URL }}
          SILMARIL_API_KEY: ${{ secrets.CUSTOMER_API_KEY }}
          CUSTOMER_BACKEND_ID: ${{ vars.CUSTOMER_BACKEND_ID }}
          CUSTOMER_TESTS_READ_TOKEN: ${{ steps.reader.outputs.token }}
          CUSTOMER_UI_URL: ${{ vars.CUSTOMER_UI_URL }}
          CUSTOMER_UI_STORAGE_STATE_JSON: ${{ secrets.CUSTOMER_UI_STORAGE_STATE_JSON }}
          CUSTOMER_FIREWALL_ID: ${{ vars.CUSTOMER_FIREWALL_ID }}
          CUSTOMER_MCP_URL: ${{ vars.CUSTOMER_MCP_URL }}
          CUSTOMER_MCP_ACCESS_TOKEN: ${{ secrets.CUSTOMER_MCP_ACCESS_TOKEN }}
      - name: Upload customer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-qualification
          retention-days: 7
          path: results/
          if-no-files-found: warn
      - name: Enforce qualified rollout
        if: vars.CUSTOMER_ACCEPTANCE_REQUIRED == 'true' && (steps.selection.outputs.should_test == 'true' || steps.plan.outputs.should_release == 'true')
        env:
          OUTCOME: ${{ steps.acceptance.outcome }}
        run: test "$OUTCOME" = success

      - name: Extract changelog notes
        id: changelog
        if: steps.plan.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/${TAG}-notes.md"
          awk -v tag="$TAG" '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::CHANGELOG.md is missing release notes for ${TAG}."
            exit 1
          fi

          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.plan.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Warm Go module proxy
        if: steps.plan.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if GOPROXY=https://proxy.golang.org go list -m "github.com/Silmaril-Security/sdk-go@${TAG}"; then
              exit 0
            fi
            echo "Go proxy has not indexed ${TAG} yet; retrying (${attempt}/12)."
            sleep 10
          done
          echo "::error::Go proxy did not index ${TAG} in time."
          exit 1

      - name: Create GitHub release
        if: steps.plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi
